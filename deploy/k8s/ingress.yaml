apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lotus-app
  namespace: lotus-notes
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lotus.example.com
      secretName: lotus-tls
  rules:
    - host: lotus.example.com
      http:
        paths:
          # MCP designer/workspace and admin surfaces are publicly routable
          # (admin exposed per ADR-0011 update 2026-06-24; gated by app auth + Host/Origin allowlist).
          - path: /mcp/admin
            pathType: Prefix
            backend:
              service:
                name: lotus-mcp
                port:
                  name: http
          - path: /mcp/designer
            pathType: Prefix
            backend:
              service:
                name: lotus-mcp
                port:
                  name: http
          - path: /mcp/workspace
            pathType: Prefix
            backend:
              service:
                name: lotus-mcp
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lotus-app
                port:
                  name: http

