apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lotus-app
  namespace: lotus-notes
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lotus.example.com
      secretName: lotus-tls
  rules:
    - host: lotus.example.com
      http:
        paths:
          # MCP designer/workspace surfaces are publicly routable; the admin surface
          # is intentionally NOT exposed here and stays reachable only in-cluster.
          - path: /mcp/designer
            pathType: Prefix
            backend:
              service:
                name: lotus-mcp
                port:
                  name: http
          - path: /mcp/workspace
            pathType: Prefix
            backend:
              service:
                name: lotus-mcp
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lotus-app
                port:
                  name: http

