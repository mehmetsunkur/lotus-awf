apiVersion: v1
kind: Service
metadata:
  name: lotus-app
  namespace: lotus-notes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lotus-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lotus-app
  namespace: lotus-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lotus-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lotus-app
    spec:
      containers:
        - name: app
          image: cr.lan.sunkur.net/lotus-notes/platform:374c793
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: API_PORT
            - name: APP_DB
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: APP_DB
            - name: PLATFORM_DB
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: PLATFORM_DB
            - name: NAMES_DB
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: NAMES_DB
            - name: APP_AUTO_SETUP
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: APP_AUTO_SETUP
            - name: TRUST_PROXY
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: TRUST_PROXY
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: COOKIE_SECURE
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: CORS_ORIGIN
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: lotus-secrets
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lotus-secrets
                  key: COUCHDB_PASSWORD
            - name: LOCAL_COUCH_URL
              value: http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@local-couchdb:5984
            - name: SERVER_COUCH_URL
              value: http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@server-couchdb:5984
            - name: LOCAL_COUCH_REPLICATION_URL
              value: http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@local-couchdb:5984
            - name: SERVER_COUCH_REPLICATION_URL
              value: http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@server-couchdb:5984
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: mcp
          image: cr.lan.sunkur.net/lotus-notes/platform:374c793
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "mcp:http"]
          ports:
            - name: mcp-http
              containerPort: 3002
          env:
            # The sidecar authenticates inbound MCP callers against the app's API
            # over the shared pod loopback; it never talks to CouchDB directly.
            - name: LOTUS_API_URL
              value: http://localhost:3001
            - name: MCP_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: MCP_HTTP_PORT
            - name: MCP_HTTP_SURFACES
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: MCP_HTTP_SURFACES
            - name: MCP_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: MCP_ALLOWED_HOSTS
            - name: MCP_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: MCP_ALLOWED_ORIGINS
            - name: MCP_SESSION_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: MCP_SESSION_TTL_MS
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp-http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp-http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lotus-mcp
  namespace: lotus-notes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lotus-app
  ports:
    - name: http
      port: 80
      targetPort: mcp-http
