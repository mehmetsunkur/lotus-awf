apiVersion: v1
kind: Service
metadata:
  name: lotus-app
  namespace: lotus-notes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lotus-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lotus-app
  namespace: lotus-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lotus-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lotus-app
    spec:
      containers:
        - name: app
          image: lotus-notes-platform:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: API_PORT
            - name: APP_DB
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: APP_DB
            - name: PLATFORM_DB
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: PLATFORM_DB
            - name: SETUP_DB
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: SETUP_DB
            - name: APP_AUTO_SETUP
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: APP_AUTO_SETUP
            - name: TRUST_PROXY
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: TRUST_PROXY
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: COOKIE_SECURE
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: lotus-config
                  key: CORS_ORIGIN
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: lotus-secrets
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lotus-secrets
                  key: COUCHDB_PASSWORD
            - name: LOCAL_COUCH_URL
              value: http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@local-couchdb:5984
            - name: SERVER_COUCH_URL
              value: http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@server-couchdb:5984
            - name: LOCAL_COUCH_REPLICATION_URL
              value: http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@local-couchdb:5984
            - name: SERVER_COUCH_REPLICATION_URL
              value: http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@server-couchdb:5984
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
