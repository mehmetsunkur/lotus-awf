apiVersion: v1
kind: ConfigMap
metadata:
  name: lotus-config
  namespace: lotus-notes
data:
  API_PORT: "3001"
  APP_DB: expense_app
  PLATFORM_DB: platform_app
  NAMES_DB: names_app
  APP_AUTO_SETUP: "1"
  TRUST_PROXY: "1"
  COOKIE_SECURE: "1"
  CORS_ORIGIN: https://lotus.example.com
  LOCAL_COUCH_HOST: local-couchdb
  SERVER_COUCH_HOST: server-couchdb
  # MCP-over-HTTP host (runs as a sidecar in the lotus-app pod).
  MCP_HTTP_PORT: "3002"
  # All three surfaces are served in-cluster; the public ingress routes
  # designer/workspace and admin (ADR-0011 amended 2026-06-24). Admin is gated
  # by the app's auth and MCP_ALLOWED_HOSTS/ORIGINS, not by network isolation.
  MCP_HTTP_SURFACES: admin,designer,workspace
  MCP_ALLOWED_HOSTS: lotus.example.com
  MCP_ALLOWED_ORIGINS: https://lotus.example.com
  MCP_SESSION_TTL_MS: "1800000"

