apiVersion: v1
kind: Service
metadata:
  name: local-couchdb
  namespace: lotus-notes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: local-couchdb
  ports:
    - name: http
      port: 5984
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: local-couchdb
  namespace: lotus-notes
spec:
  serviceName: local-couchdb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-couchdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-couchdb
    spec:
      containers:
        - name: couchdb
          image: couchdb:3.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5984
          envFrom:
            - secretRef:
                name: lotus-secrets
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

