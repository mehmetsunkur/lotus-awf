# Build the platform image natively on the self-hosted amd64 and arm64 runners, gate each
# arch with `npm run test:deploy` against the exact image, then publish one multi-arch tag.
#
# Runners are rootless-dind containers (hosted-git-runners ADR-0001): no privileged BuildKit
# container, so this uses plain `docker build` (the daemon's builder) — not setup-buildx-action,
# whose default docker-container driver cannot boot there. Each sidecar keeps its build cache
# between jobs; inline cache lets the two X64 hosts reuse each other's layers via :latest.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One run per ref at a time, so an older main run can never move :latest after a newer one.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: cr.lan.sunkur.net/lotus-notes/platform
  COMPOSE_VERSION: v5.6.0

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: X64
          - arch: arm64
            runner: ARM64
    runs-on: [self-hosted, Linux, "${{ matrix.runner }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The actions-runner image ships docker + buildx but not the compose plugin the gate needs.
      - name: Ensure docker compose
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p ~/.docker/cli-plugins
            curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
              "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-$(uname -m)"
            chmod +x ~/.docker/cli-plugins/docker-compose
          fi
          docker compose version

      - name: Build image
        run: |
          tag="$IMAGE:${GITHUB_SHA::7}-${{ matrix.arch }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build --pull \
            --cache-from "$IMAGE:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "$tag" .

      - run: npm ci

      - name: Deploy gate
        env:
          DEPLOY_SKIP_BUILD: "1"
        run: LOTUS_IMAGE="$TAG" npm run test:deploy

      - name: Push arch image
        if: github.event_name != 'pull_request'
        run: docker push "$TAG"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Create multi-arch manifest
        run: |
          sha="${GITHUB_SHA::7}"
          tags=(-t "$IMAGE:$sha")
          [ "$GITHUB_REF" = "refs/heads/main" ] && tags+=(-t "$IMAGE:latest")
          [ "$GITHUB_REF_TYPE" = "tag" ] && tags+=(-t "$IMAGE:$GITHUB_REF_NAME")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$sha-amd64" "$IMAGE:$sha-arm64"
          docker buildx imagetools inspect "$IMAGE:$sha"
